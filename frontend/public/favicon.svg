<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Outer glowing circle -->
  <circle cx="16" cy="16" r="14" fill="url(#grad)" />
  <!-- Inner dark circle -->
  <circle cx="16" cy="16" r="10" fill="#0f172a" />
  <!-- Center target point / compass -->
  <circle cx="16" cy="16" r="4" fill="url(#grad)" />
  <!-- Compass pointer lines -->
  <line x1="16" y1="8" x2="16" y2="10" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
  <line x1="16" y1="22" x2="16" y2="24" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
  <line x1="8" y1="16" x2="10" y2="16" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
  <line x1="22" y1="16" x2="24" y2="16" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" />
</svg>